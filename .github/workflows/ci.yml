name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.11.10'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check migrations
        run: uv run --frozen python manage.py makemigrations --check --dry-run
      - name: Test with coverage
        run: |
          uv run --frozen coverage run --rcfile=../pyproject.toml manage.py test
          uv run --frozen coverage report --rcfile=../pyproject.toml
      - name: Audit Python dependencies
        run: uv run --frozen pip-audit --progress-spinner off
      - name: Gate high severity Python security findings
        run: uv run --frozen bandit -r apps config -lll

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit all dependencies (including build tools)
        run: npm audit --audit-level=low
      - name: Build and type-check
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with the open-source Gitleaks CLI
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config /repo/.gitleaks.toml --redact --no-banner --log-opts=--all /repo

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          output: sarif-results
          upload: false
      - name: Fail on high or critical security findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          findings = []
          reports = list(Path('sarif-results').glob('*.sarif'))
          if not reports:
              raise SystemExit('CodeQL produced no SARIF report')
          for report in reports:
              for run in json.loads(report.read_text()).get('runs', []):
                  rules = {rule['id']: rule for rule in run['tool']['driver'].get('rules', [])}
                  for result in run.get('results', []):
                      rule = rules.get(result['ruleId'], {})
                      severity = float(rule.get('properties', {}).get('security-severity', 0))
                      if severity >= 7:
                          findings.append(result['ruleId'])
          if findings:
              raise SystemExit('High/critical CodeQL findings: ' + ', '.join(findings))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/
          retention-days: 14

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: uv sync --locked
      - name: Prepare backend
        working-directory: backend
        run: |
          uv run --frozen python manage.py migrate --noinput
          uv run --frozen python manage.py seed_curriculum
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install chromium --with-deps
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: nginx
            context: nginx
            dockerfile: nginx/Dockerfile
          - name: db
            context: postgres
            dockerfile: postgres/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build locally without publishing
        env:
          IMAGE_NAME: ${{ matrix.name }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag "pystarter-$IMAGE_NAME:ci" "$BUILD_CONTEXT"
      - name: Verify backend VEX evidence and runtime privileges
        if: matrix.name == 'backend'
        run: |
          docker run --rm --network none --entrypoint python pystarter-backend:ci -c '
          import os
          from pathlib import Path
          assert os.geteuid() == 10001
          assert not list(Path("/usr").rglob("infocmp"))
          assert not list(Path("/usr").rglob("nsenter"))
          assert not list(Path("/usr").rglob("systemd-homed"))
          assert not [p for p in Path("/usr").rglob("Tar.pm") if p.parent.name == "Archive"]
          assert not [p for root in ("/usr/bin", "/usr/sbin") for p in Path(root).iterdir() if p.is_file() and p.stat().st_mode & 0o6000]
          '
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_VEX: ${{ matrix.name == 'backend' && '.github/security/backend.vex.json' || '' }}
        with:
          version: v0.74.0
          image-ref: pystarter-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
