[project]
name = "pystarter"
version = "0.1.0"
description = "A beginner-friendly Python training platform"
requires-python = ">=3.13"
dependencies = [
    "django==6.0.8",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "anthropic==0.125.0",
    "python-dotenv==1.2.3",
    "sentry-sdk[django]==2.70.0",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    "openai==2.54.0",
    "argon2-cffi==25.1.0",
    "psycopg==3.3.3",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "coverage==7.13.5",
    "pip-audit==2.10.1",
]

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "*/management/commands/seed_curriculum.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[project.optional-dependencies]
container = ["psycopg[c]==3.3.3"]
